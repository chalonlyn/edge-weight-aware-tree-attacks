[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-weight-tree-attacks"
version = "1.0.0"
description = "Minimal executable implementation of edge-weight-aware tree attacks"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Chenlong Lin"}]

[tool.setuptools]
packages = ["edge_tree_attacks"]
